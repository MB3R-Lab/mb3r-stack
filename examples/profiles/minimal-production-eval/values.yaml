global:
  imageRegistry: "registry.example.com/observability"

collector:
  existingDeployment: "otel-collector"
  targetEndpoint: "http://bering-discovery.observability.svc.cluster.local:4318"
  snippets:
    enabled: true
    tlsInsecure: true

bering:
  enabled: true
  image:
    repository: "mb3r-lab/bering"
    tag: "v1.2.0"
    digest: "sha256:f706b79172a8322d53422de8d08a47d7779d0fbe2909511fa08385608b74c15b"
  service:
    publicName: bering-discovery
  serviceMonitor:
    enabled: true

sheaft:
  enabled: true
  image:
    repository: "mb3r-lab/sheaft"
    tag: "v1.3.2"
    digest: "sha256:12e3999a87bf2cb8a472457c3f6534b40d2e3e84feefb250372abbe6a42a9187"
  service:
    publicName: sheaft-reports
  serviceMonitor:
    enabled: true

prometheusScrapeHooks:
  enabled: true

grafanaDashboards:
  enabled: true
  providerName: "mb3r-prod"
  existingConfigMaps:
    - mb3r-bering-dashboard-v1-0-0
    - mb3r-sheaft-dashboard-v1-0-0
